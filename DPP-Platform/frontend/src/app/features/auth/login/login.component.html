<div class="login-wrapper">
  <div class="login-container">
    <!-- Brand Logo -->
    <div class="logo-area">
      <app-monk-logo [centered]="true" [size]="17"></app-monk-logo>
    </div>

    <!-- Headers -->
    <h1 class="page-title">Log in to your account</h1>
    <p class="page-subtitle">Welcome. Please enter your details.</p>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          autocomplete="email"
          class="form-control"
          [class.has-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="password-wrapper">
          <input
            id="login-password"
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="form-control"
          />
          <button
            type="button"
            class="eye-btn"
            (click)="togglePasswordVisibility()"
            aria-label="Toggle password visibility"
          >
            <mat-icon class="eye-icon">{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-signin" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign in</span>
        <span *ngIf="isLoading">Signing in...</span>
      </button>
    </form>
  </div>
</div>
