<div class="login-wrapper">
  <div class="login-container">
    <!-- Brand Logo -->
    <div class="logo-area">
      <app-monk-logo [centered]="true" [size]="17"></app-monk-logo>
    </div>

    <!-- Headers -->
    <h1 class="page-title">Log in to your account</h1>
    <p class="page-subtitle">Welcome. Please enter your details.</p>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          autocomplete="email"
          class="form-control"
          [class.has-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="password-wrapper">
          <input
            id="login-password"
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="form-control"
          />
          <button
            type="button"
            class="eye-btn"
            (click)="togglePasswordVisibility()"
            aria-label="Toggle password visibility"
          >
            <mat-icon class="eye-icon">{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-signin" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign in</span>
        <span *ngIf="isLoading">Signing in...</span>
      </button>

      <div class="forgot-wrapper">
        <a href="javascript:void(0)" class="forgot-link">Forgot password?</a>
      </div>

      <div class="register-prompt" style="text-align: center; margin-top: 12px; font-size: 13px; color: #64748b;">
        <span>New to DPP Platform? </span>
        <a routerLink="/register" style="color: #0f172a; font-weight: 600; text-decoration: none; border-bottom: 1px dashed #94a3b8;">Create Organization</a>
      </div>

      <div class="divider">
        <span class="divider-text">or continue with</span>
      </div>

      <!-- Social Logins -->
      <div class="social-row">
        <button type="button" class="social-btn" (click)="onSocialLogin('Google')" aria-label="Sign in with Google">
          <svg class="social-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </button>

        <button type="button" class="social-btn" (click)="onSocialLogin('SSO')" aria-label="Sign in with Enterprise SSO">
          <svg class="social-icon" viewBox="0 0 24 24" fill="#0078D4">
            <path d="M12 2L2 19.5H7.5L12 11.5L16.5 19.5H22L12 2Z"/>
          </svg>
        </button>
      </div>

      <div class="terms-footer">
        <span>By using Monk Spaces you agree on the <a href="javascript:void(0)" class="terms-link">terms and conditions</a></span>
      </div>
    </form>
  </div>
</div>
