<!-- Global Toast Notifications -->
<app-toast></app-toast>

<!-- Public / Auth Flow Layout (Login / Register) -->
<ng-container *ngIf="isAuthLayout">
  <router-outlet></router-outlet>
</ng-container>

<!-- Authenticated App Shell Layout (Gemini Style) -->
<div *ngIf="!isAuthLayout" class="app-layout" (click)="closeProfileMenu()">
  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="isCollapsed">
    <!-- Top Action Area -->
    <div class="sidebar-header">
      <div class="header-top-row">
        <button class="icon-btn" (click)="toggleSidebar()" aria-label="Toggle Sidebar" title="Toggle Sidebar">
          <!-- Menu Hamburger / Collapse Icon -->
          <span class="icon">☰</span>
        </button>
        <span class="brand-title" *ngIf="!isCollapsed">Monk Spaces</span>
      </div>

    </div>

    <!-- Navigation List -->
    <nav class="nav-section">
      <a routerLink="/product-passports" routerLinkActive="active" class="nav-item" title="Digital Passports">
        <span class="icon">📊</span>
        <span class="label" *ngIf="!isCollapsed">Digital Passports</span>
      </a>

      <a routerLink="/company-management" routerLinkActive="active" class="nav-item" title="Company Directory">
        <span class="icon">🏢</span>
        <span class="label" *ngIf="!isCollapsed">Company Directory</span>
      </a>

      <a routerLink="/product-management" routerLinkActive="active" class="nav-item" title="Product Catalog">
        <span class="icon">📦</span>
        <span class="label" *ngIf="!isCollapsed">Product Catalog</span>
      </a>

      <a routerLink="/user-management" routerLinkActive="active" class="nav-item" title="Manage Users">
        <span class="icon">👥</span>
        <span class="label" *ngIf="!isCollapsed">Manage Users</span>
      </a>
    </nav>

  </aside>

  <!-- Right App Container: Top Header + Main Viewport -->
  <div class="app-main-wrapper">
    <!-- Production-Grade Top Header Bar -->
    <header class="app-top-header">
      <div class="header-left">
        <span class="header-page-title">{{ getPageTitle() }}</span>
        <span class="header-tenant-chip">
          <span class="status-dot"></span>
          {{ currentUser?.organization?.name || 'Monkspaces Technologies' }}
        </span>
      </div>

      <div class="header-right">
        <!-- Theme Toggle -->
        <button class="header-btn" (click)="toggleTheme()" [title]="isDark ? 'Switch to Light mode' : 'Switch to Dark mode'">
          <span class="icon">{{ isDark ? '☀️' : '🌙' }}</span>
          <span class="btn-text">{{ isDark ? 'Light' : 'Dark' }}</span>
        </button>

        <!-- User Profile -->
        <div class="header-user-profile">
          <div class="user-avatar-small">{{ getUserInitials() }}</div>
          <span class="user-name-label">{{ getUserDisplayName() }}</span>
          <button class="logout-btn" (click)="logout()" title="Sign Out">
            <span class="icon">🚪</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Full-Width Viewport -->
    <main class="main-viewport">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
